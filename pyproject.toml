[project]
name = "eu-stress-events"
version = "0.1.0"
description = "Real stressful events in the European power system under climate change, on Climate2Energy, ERA5 and ENTSO-E data"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "pyarrow", "scipy", "matplotlib", "scikit-learn"]

[project.optional-dependencies]
model = ["pypsa", "highspy"]
grib = ["cfgrib", "xarray"]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
